{{- if .Values.infrastructure.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infrastructure.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.global.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.global.dbUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.global.dbPassword | quote }}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
{{- end }}
