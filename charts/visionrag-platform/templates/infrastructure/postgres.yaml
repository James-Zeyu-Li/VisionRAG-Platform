{{- if .Values.infrastructure.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infrastructure.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.global.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.global.dbUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.global.dbPassword | quote }}
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # 存活与就绪检查：使用 pg_isready
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.global.dbUser }}", "-d", "{{ .Values.global.dbName }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.global.dbUser }}", "-d", "{{ .Values.global.dbName }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
        # --- 新增：PostgreSQL 监控翻译官 (Sidecar) ---
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          ports:
            - containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://{{ .Values.global.dbUser }}:{{ .Values.global.dbPassword }}@localhost:5432/{{ .Values.global.dbName }}?sslmode=disable"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
  type: ClusterIP
{{- end }}
