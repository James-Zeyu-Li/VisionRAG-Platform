{{- $obs := .Values.observability | default dict -}}
{{- $pr := get $obs "prometheusRule" | default dict -}}
{{- $prEnabled := get $pr "enabled" | default false -}}
{{- $prLabels := get $pr "labels" | default dict -}}
{{- $thresholds := get $pr "thresholds" | default dict -}}
{{- $infra := .Values.infrastructure | default dict -}}
{{- $pgEnabled := true -}}
{{- $pgCfg := get $infra "postgres" | default dict -}}
{{- if hasKey $pgCfg "enabled" -}}
{{- $pgEnabled = (get $pgCfg "enabled") -}}
{{- end -}}
{{- $redisEnabled := true -}}
{{- $redisCfg := get $infra "redis" | default dict -}}
{{- if hasKey $redisCfg "enabled" -}}
{{- $redisEnabled = (get $redisCfg "enabled") -}}
{{- end -}}
{{- $rabbitEnabled := true -}}
{{- $rabbitCfg := get $infra "rabbitmq" | default dict -}}
{{- if hasKey $rabbitCfg "enabled" -}}
{{- $rabbitEnabled = (get $rabbitCfg "enabled") -}}
{{- end -}}
{{- $infraEnabled := or $pgEnabled (or $redisEnabled $rabbitEnabled) -}}
{{- $cpuRequestUtilizationPercentWarning := get $thresholds "cpuRequestUtilizationPercentWarning" | default 80 -}}
{{- $cpuLimitUtilizationPercentWarning := get $thresholds "cpuLimitUtilizationPercentWarning" | default 90 -}}
{{- $cpuThrottlingPercentWarning := get $thresholds "cpuThrottlingPercentWarning" | default 20 -}}
{{- $memoryLimitUtilizationPercentWarning := get $thresholds "memoryLimitUtilizationPercentWarning" | default 90 -}}
{{- $queueMessagesWarning := get $thresholds "queueMessagesWarning" | default 100 -}}
{{- $queueMessagesCritical := get $thresholds "queueMessagesCritical" | default 1000 -}}
{{- if $prEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: visionrag-platform-alert-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "visionrag.labels" . | nindent 4 }}
    role: alert-rules
    {{- with $prLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: visionrag-platform.availability
      rules:
        - alert: VisionRAGServiceTargetDown
          expr: up{namespace="{{ .Release.Namespace }}",job=~"gateway-service|chat-service|public-service"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "VisionRAG application target down"
            description: "One of gateway chat public service scrape targets is down for at least 2 minutes."
{{- if $infraEnabled }}
        - alert: VisionRAGInfraTargetDown
          expr: up{namespace="{{ .Release.Namespace }}",job=~"redis-service|postgres-service|rabbitmq-service"} == 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "VisionRAG infrastructure target down"
            description: "A Redis Postgres or RabbitMQ metrics target has been unavailable for at least 5 minutes."
{{- end }}
        - alert: VisionRAGDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment=~"gateway-service|chat-service|public-service"} < kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}",deployment=~"gateway-service|chat-service|public-service"}
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "VisionRAG deployment replicas unavailable"
            description: "Available replicas are below desired replicas for one of the core deployments."

    - name: visionrag-platform.stability
      rules:
        - alert: VisionRAGPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{namespace="{{ .Release.Namespace }}",reason="CrashLoopBackOff",pod=~"(gateway-service|chat-service|public-service)-.*"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "VisionRAG pod is crash looping"
            description: "A core application pod has been in CrashLoopBackOff state."

        - alert: VisionRAGPodRestartBurst
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*"}[15m]) >= 3
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "VisionRAG pod restarts detected"
            description: "A core pod restarted at least 3 times in the last 15 minutes."

        - alert: VisionRAGPodOOMKilled
          expr: max_over_time(kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}",reason="OOMKilled",pod=~"(gateway-service|chat-service|public-service)-.*"}[15m]) > 0
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "VisionRAG pod OOM killed"
            description: "A core application container was terminated due to OOMKilled recently."

    - name: visionrag-platform.capacity
      rules:
        - alert: VisionRAGAppCPURequestUtilizationHigh
          expr: (100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",cpu="total"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",resource="cpu",unit="core"}), 0.001)) > {{ $cpuRequestUtilizationPercentWarning }} and on (pod) sum by (pod) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",resource="cpu",unit="core"}) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Application CPU request utilization is high"
            description: "One of the core application pods is consuming more CPU than its configured request threshold for 10 minutes."

        - alert: VisionRAGAppCPULimitUtilizationHigh
          expr: (100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",cpu="total"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",resource="cpu",unit="core"}), 0.001)) > {{ $cpuLimitUtilizationPercentWarning }} and on (pod) sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",resource="cpu",unit="core"}) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Application CPU limit utilization is high"
            description: "One of the core application pods is close to CPU limit saturation for 10 minutes."

        - alert: VisionRAGAppCPUThrottlingHigh
          expr: (100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*"}[5m])), 1)) > {{ $cpuThrottlingPercentWarning }}
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Application CPU throttling is high"
            description: "A core application pod has sustained CPU throttling, which may impact latency and throughput."

        - alert: VisionRAGAppMemoryLimitUtilizationHigh
          expr: (100 * sum by (pod) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",resource="memory",unit="byte"}), 1)) > {{ $memoryLimitUtilizationPercentWarning }} and on (pod) sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(gateway-service|chat-service|public-service)-.*",resource="memory",unit="byte"}) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Application memory limit utilization is high"
            description: "One of the core application pods is close to memory limit saturation for 10 minutes."
{{- if $infraEnabled }}
        - alert: VisionRAGInfraCPURequestUtilizationHigh
          expr: (100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",cpu="total"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",resource="cpu",unit="core"}), 0.001)) > {{ $cpuRequestUtilizationPercentWarning }} and on (pod) sum by (pod) (kube_pod_container_resource_requests{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",resource="cpu",unit="core"}) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Infrastructure CPU request utilization is high"
            description: "Redis Postgres or RabbitMQ pod CPU is above request-based threshold for 10 minutes."

        - alert: VisionRAGInfraCPULimitUtilizationHigh
          expr: (100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",cpu="total"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",resource="cpu",unit="core"}), 0.001)) > {{ $cpuLimitUtilizationPercentWarning }} and on (pod) sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",resource="cpu",unit="core"}) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Infrastructure CPU limit utilization is high"
            description: "Redis Postgres or RabbitMQ pod CPU is close to limit saturation for 10 minutes."

        - alert: VisionRAGInfraCPUThrottlingHigh
          expr: (100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*"}[5m])), 1)) > {{ $cpuThrottlingPercentWarning }}
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Infrastructure CPU throttling is high"
            description: "Redis Postgres or RabbitMQ pods are being throttled and may impact system latency."

        - alert: VisionRAGInfraMemoryLimitUtilizationHigh
          expr: (100 * sum by (pod) (container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",resource="memory",unit="byte"}), 1)) > {{ $memoryLimitUtilizationPercentWarning }} and on (pod) sum by (pod) (kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}",pod=~"(redis|rabbitmq|postgres-db)-.*",resource="memory",unit="byte"}) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Infrastructure memory limit utilization is high"
            description: "Redis Postgres or RabbitMQ pods are close to memory limit saturation for 10 minutes."
{{- end }}

{{- if $infraEnabled }}
    - name: visionrag-platform.middleware
      rules:
{{- if $redisEnabled }}
        - alert: VisionRAGRedisUnavailable
          expr: redis_up{namespace="{{ .Release.Namespace }}"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Redis is unavailable"
            description: "Redis exporter reports redis_up equals zero for at least 5 minutes."
{{- end }}
{{- if $pgEnabled }}
        - alert: VisionRAGPostgresUnavailable
          expr: pg_up{namespace="{{ .Release.Namespace }}"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "PostgreSQL is unavailable"
            description: "Postgres exporter reports pg_up equals zero for at least 5 minutes."
{{- end }}
{{- if $rabbitEnabled }}
        - alert: VisionRAGRabbitMQBacklogHigh
          expr: sum(rabbitmq_queue_messages{namespace="{{ .Release.Namespace }}"}) > {{ $queueMessagesWarning }}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "RabbitMQ backlog high"
            description: "Total queue depth exceeded warning threshold for more than 10 minutes."

        - alert: VisionRAGRabbitMQBacklogCritical
          expr: sum(rabbitmq_queue_messages{namespace="{{ .Release.Namespace }}"}) > {{ $queueMessagesCritical }}
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "RabbitMQ backlog critical"
            description: "Total queue depth exceeded critical threshold for more than 5 minutes."
{{- end }}
{{- end }}
{{- end }}
