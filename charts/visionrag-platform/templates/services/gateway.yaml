apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    {{- include "visionrag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.microservices.gateway.replicas | default 1 }}
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: "{{ .Values.microservices.gateway.image }}:{{ .Values.microservices.gateway.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.microservices.gateway.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 9000
        envFrom:
        - configMapRef:
            name: gateway-service-config
        - secretRef:
            name: {{ .Values.global.existingSecretName | default "visionrag-platform-secrets" }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: {{ .Values.microservices.gateway.nodePort | default 30000 }}
