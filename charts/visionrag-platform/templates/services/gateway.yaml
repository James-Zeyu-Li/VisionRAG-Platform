apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    {{- include "visionrag.labels" . | nindent 4 }}
spec:
  {{- $autoscaling := .Values.microservices.gateway.autoscaling | default dict }}
  {{- $probes := .Values.microservices.gateway.probes | default dict }}
  {{- if not ($autoscaling.enabled | default false) }}
  replicas: {{ .Values.microservices.gateway.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: "{{ .Values.microservices.gateway.image }}:{{ .Values.microservices.gateway.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.microservices.gateway.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 9000
        {{- with .Values.microservices.gateway.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: gateway-service-config
        - secretRef:
            name: {{ .Values.global.existingSecretName | default "visionrag-platform-secrets" }}
        {{- if ($probes.enabled | default true) }}
        livenessProbe:
          httpGet:
            path: {{ $probes.path | default "/health" }}
            port: 9000
          initialDelaySeconds: {{ $probes.livenessInitialDelaySeconds | default 20 }}
          periodSeconds: {{ $probes.livenessPeriodSeconds | default 10 }}
          timeoutSeconds: {{ $probes.timeoutSeconds | default 1 }}
          failureThreshold: {{ $probes.livenessFailureThreshold | default 3 }}
        readinessProbe:
          httpGet:
            path: {{ $probes.path | default "/health" }}
            port: 9000
          initialDelaySeconds: {{ $probes.readinessInitialDelaySeconds | default 5 }}
          periodSeconds: {{ $probes.readinessPeriodSeconds | default 10 }}
          timeoutSeconds: {{ $probes.timeoutSeconds | default 1 }}
          failureThreshold: {{ $probes.readinessFailureThreshold | default 3 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: {{ .Values.microservices.gateway.nodePort | default 30000 }}
