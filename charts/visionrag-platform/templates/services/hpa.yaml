{{- $chatAuto := .Values.microservices.chat.autoscaling | default dict }}
{{- if ($chatAuto.enabled | default false) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service-hpa
  labels:
    {{- include "visionrag.labels" . | nindent 4 }}
    app: chat-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: {{ $chatAuto.minReplicas | default 1 }}
  maxReplicas: {{ $chatAuto.maxReplicas | default 5 }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ (get ($chatAuto.behavior | default dict) "scaleUpStabilizationWindowSeconds") | default 0 }}
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ (get ($chatAuto.behavior | default dict) "scaleDownStabilizationWindowSeconds") | default 300 }}
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $chatAuto.targetCPUUtilizationPercentage | default 75 }}
---
{{- end }}

