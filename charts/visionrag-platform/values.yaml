# 全局共享变量
global:
  # 数据库（非敏感）
  dbName: "visionrag"
  timezone: "America/Vancouver"
  redisDb: 0
  # 所有服务统一引用的外部 Secret 名称（需提前 kubectl create/apply）
  existingSecretName: "visionrag-platform-secrets"

# ... (后面部分保持不变)
infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    port: 5432
  redis:
    enabled: true
    image: redis:6.2-alpine
    port: 6379
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    port: 5672
    mgmtPort: 15672

microservices:
  public:
    name: public-service
    image: visionrag-public
    tag: latest
    replicas: 2
  chat:
    name: chat-service
    image: visionrag-chat
    tag: latest
    replicas: 1
  gateway:
    name: gateway-service
    image: visionrag-gateway
    tag: latest
    replicas: 1

observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
