# 全局共享变量
global:
  # 数据库（非敏感）
  dbName: "visionrag"
  timezone: "America/Vancouver"
  redisDb: 0
  # 所有服务统一引用的外部 Secret 名称（需提前 kubectl create/apply）
  existingSecretName: "visionrag-platform-secrets"

# ... (后面部分保持不变)
infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    serviceName: postgres-service
    port: 5432
  redis:
    enabled: true
    image: redis:6.2-alpine
    serviceName: redis-service
    port: 6379
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    serviceName: rabbitmq-service
    port: 5672
    mgmtPort: 15672
    prometheusPort: 15692

external:
  postgres:
    host: ""
    port: 5432
    dbName: visionrag
  redis:
    host: ""
    port: 6379
    db: 0
  rabbitmq:
    host: ""
    port: 5672
    vhost: /

microservices:
  public:
    name: public-service
    image: visionrag-public
    tag: latest
    pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: 150m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
    probes:
      enabled: true
      path: /health
      livenessInitialDelaySeconds: 20
      livenessPeriodSeconds: 10
      livenessFailureThreshold: 3
      readinessInitialDelaySeconds: 5
      readinessPeriodSeconds: 10
      readinessFailureThreshold: 3
      timeoutSeconds: 1
  chat:
    name: chat-service
    image: visionrag-chat
    tag: latest
    pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    sidecarResources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
      behavior:
        scaleUpStabilizationWindowSeconds: 0
        scaleDownStabilizationWindowSeconds: 300
  gateway:
    name: gateway-service
    image: visionrag-gateway
    tag: latest
    pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: 150m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    probes:
      enabled: true
      path: /health
      livenessInitialDelaySeconds: 20
      livenessPeriodSeconds: 10
      livenessFailureThreshold: 3
      readinessInitialDelaySeconds: 5
      readinessPeriodSeconds: 10
      readinessFailureThreshold: 3
      timeoutSeconds: 1

observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
    thresholds:
      cpuRequestUtilizationPercentWarning: 80
      cpuLimitUtilizationPercentWarning: 90
      cpuThrottlingPercentWarning: 20
      appPodMemoryMiBWarning: 600
      queueMessagesWarning: 100
      queueMessagesCritical: 1000
  grafanaDashboard:
    enabled: true
    namespace: monitoring
