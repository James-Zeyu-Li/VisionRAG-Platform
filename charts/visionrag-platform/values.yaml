# 全局共享变量
global:
  # 数据库（非敏感）
  dbName: "visionrag"
  timezone: "America/Vancouver"
  redisDb: 0
  # 所有服务统一引用的外部 Secret 名称（需提前 kubectl create/apply）
  existingSecretName: "visionrag-platform-secrets"

# ... (后面部分保持不变)
infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    port: 5432
  redis:
    enabled: true
    image: redis:6.2-alpine
    port: 6379
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    port: 5672
    mgmtPort: 15672

microservices:
  public:
    name: public-service
    image: visionrag-public
    tag: latest
    pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: 150m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
  chat:
    name: chat-service
    image: visionrag-chat
    tag: latest
    pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    sidecarResources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
      behavior:
        scaleUpStabilizationWindowSeconds: 0
        scaleDownStabilizationWindowSeconds: 300
  gateway:
    name: gateway-service
    image: visionrag-gateway
    tag: latest
    pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: 150m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75

observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
    thresholds:
      chatCpuCoresWarning: 0.75
      appPodMemoryMiBWarning: 600
      queueMessagesWarning: 100
      queueMessagesCritical: 1000
  grafanaDashboard:
    enabled: true
    namespace: monitoring
